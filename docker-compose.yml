services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cortexm
      POSTGRES_USER: cortexm
      POSTGRES_PASSWORD: cortexm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 cortexm_highlights.asgi:application
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A cortexm_highlights worker -l info -c 1
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
