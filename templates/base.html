{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CortexM Highlights{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'highlights/styles.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="brand" href="{% url 'upload' %}">CortexM Highlights</a>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="container">
        <span>Automated football highlight generation</span>
      </div>
    </footer>
  </body>
</html>
